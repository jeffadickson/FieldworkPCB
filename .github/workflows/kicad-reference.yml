name: KiCad reference comparison (external GPL test tool)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned external KiCad-derived WebAssembly port
        uses: actions/checkout@v4
        with:
          repository: ShinePCB/calculation
          ref: 79aab13534fd7f3dfecccbbbf8e33a04868bfc76
          path: external-kicad
          persist-credentials: false
      - name: Record reference engine metadata
        run: |
          mkdir -p reference-results
          printf '%s\n' 'external_repository=ShinePCB/calculation' 'external_revision=79aab13534fd7f3dfecccbbbf8e33a04868bfc76' 'calculator_implementation=KiCad-derived WebAssembly' > reference-results/provenance.txt
          test -s external-kicad/dist/kicad-transline.wasm
          sha256sum external-kicad/dist/kicad-transline.wasm > reference-results/wasm-sha256.txt
      - name: Capture actual external calculator outputs
        run: node tools/capture-kicad-wasm.mjs external-kicad/dist/kicad-transline.wasm reference-results/kicad-vectors.json 79aab13534fd7f3dfecccbbbf8e33a04868bfc76
      - name: Compare independent FIELDWORK analytical model
        run: node tools/run-kicad-reference.mjs reference-results/kicad-vectors.json
      - name: Retain external comparison vectors and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-external-reference-results
          path: reference-results/
          if-no-files-found: error
          retention-days: 30
