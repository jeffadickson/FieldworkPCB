name: Native preview builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, both]
        default: android
permissions:
  contents: read
jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '21'}
      - run: node scripts/install-deps.mjs
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build unsigned debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fieldwork-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .node-version}
      - run: node scripts/install-deps.mjs
      - run: npm test
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build iOS Simulator app (unsigned)
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: fieldwork-ios-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
