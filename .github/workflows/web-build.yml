name: Install dependencies and verify web build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Save generated lockfile and build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldwork-web-build-and-lock
          path: |
            package-lock.json
            dist/
          if-no-files-found: warn
