name: Publish FIELDWORK web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: node scripts/install-deps.mjs
      - name: Check calculations
        run: npm test
      - name: Build public preview under repo base
        run: npm run build -- --base=/FieldworkPCB/
      - name: Check built entrypoint and assets
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/FieldworkPCB/assets/' dist/index.html
          touch dist/.nojekyll
      - name: Install Chromium for browser preview validation
        run: npx playwright install --with-deps chromium
      - name: Check desktop and iPhone browser rendering
        run: node tools/preview-smoke.mjs
      - name: Upload screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-preview-screenshots
          path: preview-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
